<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ZUZ Clicker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #0A0A0A; color: white; font-family: system-ui; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .game-container { max-width: 480px; width: 100%; background: #1A1A1A; border-radius: 48px; padding: 20px; text-align: center; }
        .coin-3d { width: 240px; height: 240px; background: radial-gradient(circle, #FFF0A8, #D4AF37, #B8860B); border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: bold; color: #2A1A00; cursor: pointer; }
        .stats { background: rgba(0,0,0,0.5); border-radius: 32px; padding: 16px; margin: 16px 0; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .energy-bar { background: #2A2A2A; height: 14px; border-radius: 20px; overflow: hidden; margin: 10px 0; }
        .energy-fill { background: #00D18C; width: 100%; height: 100%; transition: width 0.2s; }
        button { background: linear-gradient(135deg, #D4AF37, #B8860B); border: none; padding: 10px 18px; border-radius: 40px; font-weight: bold; margin: 6px; cursor: pointer; }
        .level-badge { background: linear-gradient(135deg, #D4AF37, #FFD966); color: #1A1A1A; display: inline-block; padding: 6px 16px; border-radius: 30px; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="level-badge" id="levelDisplay">🏆 Уровень 1</div>
    <div class="coin-3d" id="coin">ZUZ</div>
    <div class="stats">
        <div class="stat-row"><span>💎 Dust</span><span id="dustBalance">0</span></div>
        <div class="stat-row"><span>⚡ Энергия</span><span id="energyValue">100</span></div>
        <div class="energy-bar"><div class="energy-fill" id="energyFill" style="width: 100%"></div></div>
        <div class="stat-row"><span>💪 Сила клика</span><span id="clickPower">1</span></div>
        <div class="stat-row"><span>🏆 Кликов</span><span id="totalClicks">0</span></div>
    </div>
    <div>
        <button id="dailyBtn">🎁 Бонус</button>
        <button id="autoMinerBtn">⚙️ Авто</button>
        <button id="leaderboardBtn">🏅 Лидеры</button>
    </div>
</div>
<script>
    const API_URL = 'https://zuzclicker-bot.onrender.com';
    let tg = window.Telegram.WebApp;
let userId = tg.initDataUnsafe.user?.id || 'test_user_001';
let username = tg.initDataUnsafe.user?.username || tg.initDataUnsafe.user?.first_name || "Игрок";

    let dust = 0, energy = 100, clickPower = 1, totalClicks = 0, level = 1;

    async function login() {
        try {
            const res = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: userId, username })
            });
            const data = await res.json();
            if (data.error) return alert('Ошибка: ' + data.error);
            dust = data.balance_dust ?? 0;
            energy = data.energy ?? 100;
            clickPower = data.click_power ?? 1;
            totalClicks = data.total_clicks ?? 0;
            level = data.level ?? 1;
            updateUI();
        } catch(e) { alert('Ошибка подключения к серверу'); }
    }

    function updateUI() {
        document.getElementById('dustBalance').innerText = dust;
        document.getElementById('energyValue').innerText = energy;
        document.getElementById('clickPower').innerText = clickPower;
        document.getElementById('totalClicks').innerText = totalClicks;
        document.getElementById('levelDisplay').innerHTML = `🏆 Уровень ${level}`;
        document.getElementById('energyFill').style.width = `${(energy / 100) * 100}%`;
    }

    async function handleClick() {
        if (energy < clickPower) {
            alert("⛔ Нет энергии!");
            return;
        }
        try {
            const res = await fetch(`${API_URL}/api/click`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegram_id: userId, clickX: 50, clickY: 50 })
            });
            const data = await res.json();
            if (data.success) {
                dust = data.dust;
                energy = data.energy;
                level = data.level;
                clickPower = data.clickPower;
                totalClicks = data.totalClicks;
                updateUI();
            } else {
                alert(data.message);
            }
        } catch(e) { alert('Ошибка сети'); }
    }

    document.getElementById('coin').addEventListener('click', handleClick);
    document.getElementById('coin').addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleClick();
    });

    document.getElementById('leaderboardBtn').onclick = async () => {
        try {
            const res = await fetch(`${API_URL}/api/leaderboard`);
            const leaders = await res.json();
            let msg = "🏆 ТОП-10 КЛИКЕРОВ 🏆\n\n";
            leaders.forEach((u, i) => msg += `${i+1}. ${u.username} — ${u.total_clicks} кликов (ур. ${u.level})\n`);
            alert(msg);
        } catch(e) { alert('Ошибка'); }
    };

    login();
</script>
</body>
</html>
